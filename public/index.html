<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FreshCart Grocery Shop</title><link rel="stylesheet" href="/style.css"></head><body>
<header class="topbar"><div class="brand"><span>🛒</span><div><strong>FreshCart</strong><small>Daily groceries, delivered.</small></div></div><button id="cartButton" class="cart-button">Cart <b id="cartCount">0</b></button></header>
<main><section class="hero"><div><p class="eyebrow">FRESH • FAST • LOCAL</p><h1>Everything your kitchen needs.</h1><p>Shop fresh produce, dairy, staples, snacks and drinks from one simple grocery store.</p></div><div class="hero-art">🥦 🍎 🥕</div></section>
<section class="toolbar"><input id="search" type="search" placeholder="Search groceries..."><div id="categories" class="categories"></div></section><section id="products" class="product-grid"></section></main>
<aside id="cartPanel" class="cart-panel"><div class="cart-header"><h2>Your Cart</h2><button id="closeCart" class="icon-button">×</button></div><div id="cartItems" class="cart-items"></div><div class="cart-footer"><div class="total-row"><span>Total</span><strong id="cartTotal">₹0</strong></div><button id="checkoutButton" class="primary full">Proceed to Checkout</button></div></aside><div id="overlay" class="overlay"></div>
<div id="checkoutModal" class="modal hidden"><div class="modal-card"><button id="closeModal" class="icon-button modal-close">×</button><p class="eyebrow">CHECKOUT</p><h2>Delivery details</h2><form id="checkoutForm"><label>Name<input name="name" required placeholder="Your name"></label><label>Phone<input name="phone" required inputmode="tel" placeholder="10-digit mobile number"></label><label>Address<textarea name="address" required rows="3" placeholder="House, street, area"></textarea></label><label>Payment<select name="paymentMethod"><option>Cash on Delivery</option><option>UPI</option><option>Card</option></select></label><button class="primary full" type="submit">Place Order</button></form><p id="checkoutMessage" class="message"></p></div></div>
<script src="/app.js"></script></body></html>
